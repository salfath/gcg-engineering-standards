name: Standards documentation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  handbook:
    name: Validate handbook links
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Validate local documentation links
        run: python3 scripts/check_handbook.py
