# Example identity record; NOT a certified or deployable release.
# Product CI must validate its concrete schema and reject unresolved placeholders.
# Hash/sign this immutable identity separately from append-only approval records.
manifest_version: 2
release: REPLACE_CALVER
status: unconfigured
components:
  - name: REPLACE_COMPONENT
    source:
      repository: REPLACE_CANONICAL_SOURCE
      branch: main
      commit: REPLACE_FULL_COMMIT_SHA
    build:
      run: REPLACE_CI_RUN_REFERENCE
      builder: REPLACE_APPROVED_BUILDER
      dependency_lock_digest: "sha256:REPLACE_DIGEST"
      provenance: REPLACE_BUILD_EVIDENCE
    artifact:
      uri: REPLACE_IMMUTABLE_IMAGE_OR_BUNDLE
      digest: "sha256:REPLACE_DIGEST"
# Repeat components for independently built frontend/backend/worker/client outputs.
# Include shared frameworks, runtime/base images or other inputs not bundled above.
platform_inputs:
  - name: REPLACE_SHARED_INPUT
    identity: REPLACE_VERSION_OR_FULL_COMMIT
    digest: "sha256:REPLACE_DIGEST"
compatibility:
  component_matrix_evidence: REPLACE_SUPPORTED_COMBINATIONS_AND_TEST_EVIDENCE
  clients:
    - component: REPLACE_CLIENT_COMPONENT_OR_REVIEWED_NOT_APPLICABLE
      backend_compatibility: REPLACE_SUPPORTED_RANGE
      signature_evidence: REPLACE_EVIDENCE_OR_REVIEWED_NOT_APPLICABLE
schema:
  migration: REPLACE_REVISION_OR_REVIEWED_NOT_APPLICABLE
  previous_app_compatible: false
  compatibility_evidence: REPLACE_TEST_EVIDENCE
  rollback_window: REPLACE_WINDOW
rollback:
  validated_manifest_digest: "sha256:REPLACE_PREVIOUS_MANIFEST_DIGEST"
  current_schema_compatibility_evidence: REPLACE_EVIDENCE
release_notes: REPLACE_REFERENCE
# Environment settings are separate versioned inputs; never put secret values here.
configuration_contract: REPLACE_VERSIONED_CONTRACT
# Approvals bind the digest of this manifest; changing an approval never changes it.
promotion_evidence:
  record_reference: REPLACE_APPROVAL_AND_DEPLOYMENT_RECORD
  required_fields:
    - manifest_digest
    - verified_artifact_digests
    - target_and_configuration_revision
    - dev_verification_result
    - staging_uat_candidate_and_outcomes
    - staging_approver_and_timestamp
    - production_approver_and_timestamp
    - product_preflight_result
    - deployment_actor_timestamps_and_result
    - migration_and_smoke_and_monitoring_results
