# Copy to the product repo and implement the shared check command.
# Add product runtime, disposable services and locked dependencies before use.
name: Product CI example

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  required:
    name: Required product checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Confirm product adapter is configured
        run: |
          echo 'Configure locked setup and real lint/test/build/security checks.' >&2
          exit 1
      # Replace the guard only when the product implements setup and check.
      # - run: make setup
      # - run: make check
